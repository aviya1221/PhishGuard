services:
  - type: web
    name: phishguard-server
    runtime: python
    plan: free
    rootDir: server-phishGuard
    buildCommand: pip install -r requirements.txt
    # Behind Render's proxy, read the real client IP from X-Forwarded-For (used by the rate limiter)
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips="*"
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Prompted for in the Render dashboard, never stored in the repo
